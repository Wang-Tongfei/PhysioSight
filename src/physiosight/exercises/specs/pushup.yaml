id: pushup
version: "1.0.0"
kind: repetition
name_key: exercise.pushup
view: side
params:
  max_side_span: {default: 0.35, min: 0.05, max: 1.5, unit: ratio, doc: "shoulder width / torso length below which the camera is side-on"}
  extended_angle: {default: 155, min: 120, max: 180, unit: deg}
  start_angle: {default: 145, min: 90, max: 175, unit: deg}
  depth_angle: {default: 100, min: 40, max: 160, unit: deg}
  min_body_line: {default: 160, min: 120, max: 180, unit: deg, doc: "shoulder-hip-ankle angle"}
  max_incline: {default: 35, min: 5, max: 89, unit: deg, doc: "shoulder-ankle line vs horizontal"}
  min_elbow_drop: {default: 0.035, min: 0, max: 0.5, unit: image_height}
  min_wrist_drop: {default: 0.055, min: 0, max: 0.5, unit: image_height}
  min_rep_s: {default: 0.8, min: 0, max: 10, unit: s}
  ready_hold_s: {default: 0.12, min: 0, max: 5, unit: s}
  target_hold_s: {default: 0.06, min: 0, max: 5, unit: s}
  return_hold_s: {default: 0.09, min: 0, max: 5, unit: s}
  tracking_grace_s: {default: 0.03, min: 0, max: 5, unit: s}
required: [left_shoulder, right_shoulder, left_elbow, right_elbow, left_wrist, right_wrist,
           left_hip, right_hip, left_ankle, right_ankle]
features:
  shoulder_span: {type: distance_ratio, points: [left_shoulder, right_shoulder, [left_shoulder, right_shoulder], [left_hip, right_hip]]}
  elbow_l: {type: joint_angle, points: [left_shoulder, left_elbow, left_wrist]}
  elbow_r: {type: joint_angle, points: [right_shoulder, right_elbow, right_wrist]}
  line_l: {type: joint_angle, points: [left_shoulder, left_hip, left_ankle]}
  line_r: {type: joint_angle, points: [right_shoulder, right_hip, right_ankle]}
  incline: {type: segment_incline, points: [[left_shoulder, right_shoulder], [left_ankle, right_ankle]]}
  elbow_drop: {type: vertical_offset, points: [[left_elbow, right_elbow], [left_shoulder, right_shoulder]]}
  wrist_drop: {type: vertical_offset, points: [[left_wrist, right_wrist], [left_shoulder, right_shoulder]]}
derived:
  body_line: "mean(line_l, line_r)"
  horizontal: "incline < p.max_incline"
  supported: "elbow_drop > p.min_elbow_drop or wrist_drop > p.min_wrist_drop"
  posture_ok: "body_line >= p.min_body_line and horizontal and supported"
ready: {when: "elbow_l >= p.extended_angle and elbow_r >= p.extended_angle and posture_ok", hold_s: p.ready_hold_s}
start: {when: "elbow_l < p.start_angle and elbow_r < p.start_angle"}
target: {when: "elbow_l <= p.depth_angle and elbow_r <= p.depth_angle", hold_s: p.target_hold_s}
return: {when: "elbow_l >= p.extended_angle and elbow_r >= p.extended_angle and posture_ok", hold_s: p.return_hold_s}
min_rep_duration_s: p.min_rep_s
tracking_grace_s: p.tracking_grace_s
missed_target_fault: shallow_pushup
checks:
  - {id: alignment, when: "not posture_ok", fault: pushup_body_alignment, scope: movement}
record:
  elbow_flexion_left: "180 - elbow_l"
  elbow_flexion_right: "180 - elbow_r"
  body_line: "body_line"
primary_metric: {label_key: metric.elbow, expr: "mean(elbow_l, elbow_r)"}
tracking_hint: hint.pushup.in_view
hints:
  - {when: "not horizontal", key: hint.pushup.side_on}
  - {when: "not supported", key: hint.pushup.hands_under}
  - {when: "body_line < p.min_body_line", key: hint.common.straight_line}
  - {when: "state.at_target", key: hint.pushup.push_up}
  - {when: "not state.ready", key: hint.pushup.hold_top}
default_hint: hint.common.progress
view_check: "shoulder_span < p.max_side_span"
