id: bicep_curl
version: "1.0.0"
kind: repetition
name_key: exercise.bicep_curl
sides: [right, left]
view: any
params:
  extended_angle: {default: 160, min: 120, max: 180, unit: deg, doc: "elbow interior angle counted as extended"}
  flexed_angle: {default: 45, min: 10, max: 120, unit: deg, doc: "elbow interior angle counted as fully curled"}
  start_drop: {default: 10, min: 1, max: 60, unit: deg, doc: "drop below extended_angle that starts a repetition"}
  max_upper_arm_angle: {default: 35, min: 5, max: 90, unit: deg, doc: "hip-shoulder-elbow angle above which the upper arm drifts"}
  min_rep_s: {default: 0.6, min: 0, max: 10, unit: s}
  ready_hold_s: {default: 0.12, min: 0, max: 5, unit: s}
  target_hold_s: {default: 0.06, min: 0, max: 5, unit: s}
  return_hold_s: {default: 0.09, min: 0, max: 5, unit: s}
  tracking_grace_s: {default: 0.03, min: 0, max: 5, unit: s}
required: ["{side}_shoulder", "{side}_elbow", "{side}_wrist", "{side}_hip"]
features:
  elbow: {type: joint_angle, points: ["{side}_shoulder", "{side}_elbow", "{side}_wrist"]}
  upper_arm: {type: joint_angle, points: ["{side}_hip", "{side}_shoulder", "{side}_elbow"]}
derived:
  arm_drift: "upper_arm > p.max_upper_arm_angle"
ready: {when: "elbow >= p.extended_angle", hold_s: p.ready_hold_s}
start: {when: "elbow < p.extended_angle - p.start_drop"}
target: {when: "elbow <= p.flexed_angle", hold_s: p.target_hold_s}
return: {when: "elbow >= p.extended_angle", hold_s: p.return_hold_s}
min_rep_duration_s: p.min_rep_s
tracking_grace_s: p.tracking_grace_s
missed_target_fault: partial_curl
checks:
  - {id: upper_arm, when: "arm_drift", fault: upper_arm_drift, scope: movement}
record:
  elbow_flexion_{side}: "180 - elbow"
  shoulder_elevation_{side}: "upper_arm"
primary_metric: {label_key: metric.elbow, expr: "elbow"}
tracking_hint: hint.curl.in_view
hints:
  - {when: "arm_drift", key: hint.curl.upper_arm_close}
  - {when: "not state.ready", key: hint.curl.extend_first}
  - {when: "state.at_target", key: hint.curl.lower_with_control}
default_hint: hint.curl.full_range
