[project]
name = "physiosight"
version = "0.1.0"
description = "Single-camera, real-time, markerless movement analysis for rehabilitation exercises (research/demo tool, not a medical device)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - see repository" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9"]
mediapipe = ["mediapipe>=0.10.14", "opencv-python-headless>=4.9"]
notify = ["requests>=2.31"]
eval = ["scipy>=1.11"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-requests", "scipy>=1.11"]

[project.scripts]
physiosight = "physiosight.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physiosight"]

[tool.hatch.build.targets.wheel.force-include]
# bundle the MediaPipe models (Apache-2.0) so a pip-installed package works without a checkout
"models/pose_landmarker_lite.task" = "physiosight/models/pose_landmarker_lite.task"
"models/hand_landmarker.task" = "physiosight/models/hand_landmarker.task"

[tool.hatch.build.targets.sdist]
exclude = ["/models", "/legacy", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# repository root first, so `tools` resolves to this repo and not to an unrelated installed package
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 130
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "UP007"]

[tool.mypy]
python_version = "3.11"
packages = ["physiosight"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"tools/experiments/*" = ["E501"]
